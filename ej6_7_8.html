<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 2 - Ejercicios de Ciclos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <a href="index.html" class="btn btn-outline-secondary mb-3"> Volver al Índice</a>
        <h1 class="mb-4 text-primary">Página 2: Ciclos (While y For)</h1>

        <div class="row g-4">
            <!-- Ejercicio 6 -->
            <div class="col-md-12">
                <div class="card shadow-sm p-3">
                    <h4>1. Suma de Números Impares (1 al 100)</h4>
                    <button class="btn btn-primary w-25 mt-2" onclick="ejercicio6_sumaImpares()">Calcular Suma</button>
                    <p id="res6" class="mt-3 fw-bold text-success"></p>
                </div>
            </div>

            <!-- Ejercicio 7 -->
            <div class="col-md-12">
                <div class="card shadow-sm p-3">
                    <h4>2. Mostrar Asteriscos</h4>
                    <div class="mb-3 w-50">
                        <input type="number" id="cantAsteriscos" class="form-control" placeholder="Cantidad de asteriscos">
                    </div>
                    <button class="btn btn-primary w-25" onclick="ejercicio7_mostrarAsteriscos()">Imprimir Asteriscos</button>
                    <p id="res7" class="mt-3 fw-bold text-success fs-5"></p>
                </div>
            </div>

            <!-- Ejercicio 8 -->
            <div class="col-md-12">
                <div class="card shadow-sm p-3">
                    <h4>3. Tablas de Multiplicar del 1 al 10</h4>
                    <button class="btn btn-primary w-25 mt-2 mb-3" onclick="ejercicio8_tablasMultiplicar()">Generar Tablas</button>
                    <div id="res8" class="row"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/funciones.js"></script>
</body>
</html>

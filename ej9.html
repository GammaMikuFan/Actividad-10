<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 3 - Arreglos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <a href="index.html" class="btn btn-outline-secondary mb-3"> Volver al Índice</a>
        <h1 class="mb-4 text-primary">Página 3: Operaciones con Arreglos</h1>

        <div class="card shadow-sm p-4 mb-4">
            <h3>Arreglo Actual de Países</h3>
            <div id="vistaArreglo" class="alert alert-info fw-bold mb-3">Cargando arreglo...</div>    
        </div>

        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Ejecuta cada acción de forma independiente:</h3>
            
            <div class="row g-3">
                <input type="text" id="pais" class="form-control" placeholder="Nombre del país">
                <input type="text" id="indice" class="form-control" placeholder="Índice para reemplazar">
                <input type="text" id="paisDos" class="form-control" placeholder="Segundo país para concatenar">
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Pop()">1. Pop (Eliminar último)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Shift()">2. Shift (Eliminar primero)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Push()">3. Push (Agregar al final)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Unshift()">4. Unshift (Agregar al inicio)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Splice()">5. Splice (Reemplazar)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Delete()">6. Delete (Borrar índice)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Reverse()">7. Reverse (Invertir)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Sort()">8. Sort (Ordenar A-Z)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Concat()">9. Concat (Unir arreglos)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Join()">10. Join (Convertir a texto)</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="Length()">11. Length (Longitud)</button>
                </div>
            </div>

            <p id="res9" class="mt-4 p-3 bg-white border rounded shadow-sm">...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/funciones.js"></script>
</body>
</html>
